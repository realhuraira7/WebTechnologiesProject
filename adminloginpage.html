<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign in | goRide</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<header class="text-center pt-4">
  <a class="fs-2 fw-bold text-black text-decoration-none" href="adminloginpage.html" aria-label="goRide website">
    <span class="d-inline-flex align-items-center justify-content-center align-middle rounded-circle bg-success text-white fs-6 lh-1 me-2" style="width: 32px; height: 32px;" aria-hidden="true">g</span>goRide
  </a>
  <p class="text-body-secondary mb-0">Manage bookings and your fleet.</p>
</header>

<main class="flex-grow-1 d-flex align-items-center py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-6 col-lg-5 col-xl-4">

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-1">Admin sign in</h1>
            <p class="text-body-secondary mb-4">Use your goRide staff account.</p>

              <div class="mb-3">
                <label for="staff-id" class="form-label">Staff-ID</label>
                <input id="staff-id" name="staff-id" type="text" class="form-control" autocomplete="username" autocapitalize="none" spellcheck="false" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
          </div>
        </div>

        <div class="alert alert-danger mt-3" role="alert" id="alert" hidden>
          Invalid staff-id or password.
        </div>
        <p class="text-center text-body-secondary small">Admin access is for authorised goRide staff only.</p>

      </div>
    </div>5
  </div>
</main>
</body>
</html>
